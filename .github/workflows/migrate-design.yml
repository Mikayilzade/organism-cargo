name: Migrate frozen Organism Cargo design

on:
  push:
    paths:
      - '.github/workflows/migrate-design.yml'
      - 'MIGRATION_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone factory repository
        run: git clone --depth 1 https://github.com/Mikayilzade/gpt-game-autonomy.git /tmp/factory

      - name: Copy frozen game-design files
        shell: bash
        run: |
          set -euo pipefail
          for src in /tmp/factory/*.md; do
            name="$(basename "$src")"
            case "$name" in
              README.md) ;;
              START_HERE.md) cp "$src" DESIGN_START_HERE.md ;;
              STATUS.md) cp "$src" DESIGN_STATUS.md ;;
              *) cp "$src" "$name" ;;
            esac
          done
          rm -f __migration_probe__.md

      - name: Commit migrated design
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes required."
          else
            git commit -m "Migrate frozen Organism Cargo design from factory"
            git push
          fi

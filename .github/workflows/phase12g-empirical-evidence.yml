name: Phase 12G Empirical Evidence Harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase12g-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import and parse project
        shell: bash
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Validate empirical evidence aggregation and fail-closed schema
        shell: bash
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tests/unit/phase12g_empirical_evidence_test_runner.gd

      - name: Validate empirical evidence atomic capture store
        shell: bash
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tests/unit/phase12g_empirical_evidence_store_test_runner.gd

      - name: Validate operator import reporting cohorts and Bronze geometry evidence
        shell: bash
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tests/unit/phase12g_operator_report_geometry_test_runner.gd

      - name: Validate study merge manifest and certified Bronze ingestion infrastructure
        shell: bash
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tests/unit/phase12g_study_infrastructure_test_runner.gd

      - name: Validate session-bound study package merge and audit
        shell: bash
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tests/unit/phase12g_study_package_test_runner.gd

      - name: Validate operator package CLI orchestration and immutable sources
        shell: bash
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tests/unit/phase12g_operator_package_test_runner.gd

      - name: Smoke actual operator CLI dry-run entry point
        shell: bash
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tools/phase12g_operator_package.gd -- \
            --mode=manifest-create \
            --session-id=ci-smoke \
            --prototype-build-id=ci-build \
            --rules-version=ci-rules \
            --content-version=ci-content \
            --cohort=POST_ONBOARDING_FAMILIAR_ORDINARY \
            --sample-type=planning_duration \
            --contract-id=C10 \
            --created-at-unix=1800000204 \
            --dry-run

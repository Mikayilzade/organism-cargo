name: Content Population Validator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import and validate frozen content population contract
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          log_file="$(mktemp)"
          set +e
          ${GODOT} --headless --editor --path . --quit 2>&1 | tee "${log_file}"
          import_rc=${PIPESTATUS[0]}
          set -e
          if [ ${import_rc} -ne 0 ] || grep -Eq 'SCRIPT ERROR:|Failed to load script' "${log_file}"; then
            exit 1
          fi
          : > "${log_file}"
          set +e
          ${GODOT} --headless --path . --script tests/unit/content_population_validator_test_runner.gd 2>&1 | tee "${log_file}"
          test_rc=${PIPESTATUS[0]}
          set -e
          if [ ${test_rc} -ne 0 ] || grep -Eq 'SCRIPT ERROR:|Failed to load script' "${log_file}"; then
            exit 1
          fi
